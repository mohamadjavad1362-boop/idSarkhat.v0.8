name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IDSARKHAT_KEYSTORE_B64: ${{ secrets.IDSARKHAT_KEYSTORE_B64 }}
      IDSARKHAT_KEYSTORE_PASSWORD: ${{ secrets.IDSARKHAT_KEYSTORE_PASSWORD }}
      IDSARKHAT_KEY_ALIAS: ${{ secrets.IDSARKHAT_KEY_ALIAS }}
      IDSARKHAT_KEY_PASSWORD: ${{ secrets.IDSARKHAT_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Prepare signing key
        run: |
          if [ -n "$IDSARKHAT_KEYSTORE_B64" ]; then
            echo "$IDSARKHAT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idSarkhat-release.jks"
            test -s "$RUNNER_TEMP/idSarkhat-release.jks"
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v               -keystore "$RUNNER_TEMP/idSarkhat-test.jks"               -storepass android -keypass android               -alias idSarkhatTest -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=idSarkhat Test, OU=Development, O=idSarkhat, L=Test, ST=Test, C=US"
            echo "SIGNING_MODE=test" >> "$GITHUB_ENV"
          fi

      - name: Align and sign APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="app/build/outputs/apk/release/idSarkhat-v0.8-release.apk"

          "$ZIPALIGN" -f 4 "$INPUT" "$OUTPUT"

          if [ "$SIGNING_MODE" = "persistent" ]; then
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/idSarkhat-release.jks"               --ks-pass "pass:$IDSARKHAT_KEYSTORE_PASSWORD"               --ks-key-alias "$IDSARKHAT_KEY_ALIAS"               --key-pass "pass:$IDSARKHAT_KEY_PASSWORD"               "$OUTPUT"
          else
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/idSarkhat-test.jks"               --ks-pass pass:android               --key-pass pass:android               --ks-key-alias idSarkhatTest               "$OUTPUT"
          fi

          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idSarkhat-v0.8-release
          path: app/build/outputs/apk/release/idSarkhat-v0.8-release.apk
