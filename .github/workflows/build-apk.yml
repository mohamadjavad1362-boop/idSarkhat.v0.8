name: Build APK
# Release build with persistent signing support.
# If repository secrets are configured, the same signing certificate is used on every build.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Prepare persistent signing key
        if: ${{ secrets.IDSARKHAT_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.IDSARKHAT_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idSarkhat-release.jks"
          test -s "$RUNNER_TEMP/idSarkhat-release.jks"

      - name: Create temporary test signing key (fallback)
        if: ${{ secrets.IDSARKHAT_KEYSTORE_B64 == '' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/idSarkhat-test.jks" \
            -storepass android -keypass android \
            -alias idSarkhatTest -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=idSarkhat Test, OU=Development, O=idSarkhat, L=Test, ST=Test, C=US"

      - name: Align and sign release APK
        env:
          USE_PERSISTENT: ${{ secrets.IDSARKHAT_KEYSTORE_B64 != '' }}
          KEYSTORE_PASSWORD: ${{ secrets.IDSARKHAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IDSARKHAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IDSARKHAT_KEY_PASSWORD }}
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="app/build/outputs/apk/release/idSarkhat-v0.8-release.apk"
          "$ZIPALIGN" -f 4 "$INPUT" "$OUTPUT"

          if [ "$USE_PERSISTENT" = "true" ]; then
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/idSarkhat-release.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$OUTPUT"
          else
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/idSarkhat-test.jks" \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$OUTPUT"
          fi

          "$APKSIGNER" verify --verbose "$OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idSarkhat-v0.8-release
          path: app/build/outputs/apk/release/idSarkhat-v0.8-release.apk
